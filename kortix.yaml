# yaml-language-server: $schema=https://kortix.com/schema/kortix.schema.json
#
# tasklet-migration-kit: the Kortix project manifest. The agent defined here runs a
# migration: it inventories an export from a hosted agent product, writes one prompt
# file per agent, and lists the credentials to reissue.
# Reference: https://kortix.com/docs/developers#kortixyaml-reference

project:
  name: "tasklet-migration-kit"
  description: Inventory an export from a hosted agent product and move it onto files.

# The agent a session or trigger runs when it names none.
default_agent: worker

# Project skills: folders under skills/, registered by name.
skills:
  - migration-checklist

agents:
  worker:
    description: "Migration worker: inventories an export, writes one prompt file per agent, maps skills and credentials."
    mode: primary
    permission: allow
    prompt_file: agents/worker.md
    tools: all
    skills: all
    connectors: all
    secrets: all
    kortix_permissions: all
    workspace: { project_repository: true }

# Add under `triggers:` when a migrated agent needs a schedule, for example:
#   - slug: morning-triage
#     type: cron
#     cron: "0 0 8 * * 1-5"
#     agent: worker
#     prompt: Inventory the export and open a change request with what is still missing.
